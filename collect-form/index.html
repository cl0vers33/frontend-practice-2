<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>个人购物车物品记录</title>
</head>
<body>
  <header>
    <h1>个人购物车物品记录</h1>

  </header>

  <nav>
    <a href="#intro">使用说明</a>
    <a href="#add">添加物品</a>

  </nav>

  <main>
    <!-- 使用说明区 -->
    <section id="intro">
      <h2>使用说明</h2>
      <p>本页面用于记录个人购物车中的物品，便于比价、备忘和控制消费。每提交一次生成一条物品记录，下方"已记录物品"表格中可查看全部条目。把想买的东西先记下来，冷静几天再决定是否下单。</p>
    </section>

    <section id="add">
      <h2>添加物品</h2>
      <p>（表单下一步填在这里）</p>
    </section>

    <!-- 已记录物品区 -->
    <section id="list">
      <h2>已记录物品</h2>
      <p>（表格下一步填在这里）</p>
    </section>
  </main>

  <footer>
    <p>软件开发综合实践 · 个人购物车物品记录演示 · © 2026 消费记录本</p>
  </footer>
